<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><title>{{name}} – Cover letter</title>
<style>
/* Static Roboto (Latin incl. umlauts), bundled in ./fonts (Apache 2.0, see fonts/LICENSE-Roboto.txt) */
@font-face{font-family:RV;font-weight:300;src:url(fonts/roboto-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:RV;font-weight:600;src:url(fonts/roboto-latin-500-normal.woff2) format("woff2")}
@page{size:210mm 297mm;margin:20mm 20mm 18mm 20mm}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:RV;font-weight:300;font-size:10pt;line-height:16px;color:#000;hyphens:auto}
:root{--ink:{{accent}}}
a{color:inherit;text-decoration:none}
h1{font-weight:600;font-size:18pt;line-height:29px;text-align:center;margin:0 0 2px;color:var(--ink)}
.tag{font-weight:600;font-size:10pt;text-align:center;letter-spacing:.04em;color:var(--ink);margin:0 0 3px}
.contact{text-align:center;margin:0;font-size:9pt;white-space:nowrap;padding-bottom:10px;border-bottom:.75pt solid var(--ink)}
.meta{display:flex;justify-content:space-between;margin-top:26px}
.subject{font-weight:600;margin-top:26px;color:var(--ink)}
p{margin:0} .body p{margin-top:9px} .body p.first{margin-top:20px}
.sign{margin-top:18px} .name{margin-top:30px;font-weight:600}
</style></head><body>
<h1>{{name}}</h1>
<p class="tag">{{tagline}}</p>
<p class="contact">{{contact_line}}</p>
<div class="meta"><div>{{recipient_html}}</div><div style="align-self:flex-end">{{place_date}}</div></div>
<p class="subject">{{subject}}</p>
<div class="body">
<p class="first">{{salutation}}</p>
{{paragraphs_html}}
<p class="sign">{{signoff}}</p>
<p class="name">{{name}}</p>
</div>
</body></html>
